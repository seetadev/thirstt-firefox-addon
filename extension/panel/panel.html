<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thirstt</title>
  <link rel="stylesheet" href="panel.css">
  <script type="module" src="panel.js"></script>
</head>
<body>
  <header>
    <img id="logo" src="../icons/logo-115.png" alt="" width="50" height="50">
    <button id="close" type="button" aria-label="Close Thirstt">&times;</button>
  </header>

  <main>
    <p id="loading" role="status">Loading&hellip;</p>

    <form id="login" hidden>
      <h2>Please log in to continue</h2>
      <label>E-mail <input id="email" name="email" type="email" autocomplete="username" required></label>
      <label>Password <input id="password" name="password" type="password" autocomplete="current-password" required></label>
      <p id="login-error" role="alert" hidden></p>
      <button id="login-button" type="submit">Log in</button>
      <p id="register">Don't have a Thirstt account? <a id="register-link" target="_blank" rel="noopener noreferrer">Register here.</a></p>
    </form>

    <article id="article" hidden>
      <h1 id="article-title"></h1>
      <div id="article-content"></div>
    </article>

    <p id="error" role="alert" hidden></p>
  </main>
</body>
</html>
